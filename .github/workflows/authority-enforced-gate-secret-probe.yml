name: Authority ENFORCED_GATE secret probe

on:
  push:
    branches:
      - authority-enforced-gate-secret-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_APP_ID_VALUE: ${{ secrets.GITHUB_APP_ID }}
      GITHUB_APP_PRIVATE_KEY_VALUE: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      TOOKEFFECT_GITHUB_APP_ID_VALUE: ${{ secrets.TOOKEFFECT_GITHUB_APP_ID }}
      TOOKEFFECT_GITHUB_APP_PRIVATE_KEY_VALUE: ${{ secrets.TOOKEFFECT_GITHUB_APP_PRIVATE_KEY }}
      TOOKEFFECT_APP_ID_VALUE: ${{ secrets.TOOKEFFECT_APP_ID }}
      TOOKEFFECT_APP_PRIVATE_KEY_VALUE: ${{ secrets.TOOKEFFECT_APP_PRIVATE_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          present() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              printf '%s=true\n' "$name"
            else
              printf '%s=false\n' "$name"
            fi
          }
          present GITHUB_APP_ID "$GITHUB_APP_ID_VALUE"
          present GITHUB_APP_PRIVATE_KEY "$GITHUB_APP_PRIVATE_KEY_VALUE"
          present TOOKEFFECT_GITHUB_APP_ID "$TOOKEFFECT_GITHUB_APP_ID_VALUE"
          present TOOKEFFECT_GITHUB_APP_PRIVATE_KEY "$TOOKEFFECT_GITHUB_APP_PRIVATE_KEY_VALUE"
          present TOOKEFFECT_APP_ID "$TOOKEFFECT_APP_ID_VALUE"
          present TOOKEFFECT_APP_PRIVATE_KEY "$TOOKEFFECT_APP_PRIVATE_KEY_VALUE"
